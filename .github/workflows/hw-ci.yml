name: hw-ci
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  checks: read
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Static smoke parses the chart workflow with PyYAML; verification needs no live services.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install static verification dependency
        run: python3 -m pip install PyYAML==6.0.3
      - name: Use gate from the protected base revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$GITHUB_EVENT_NAME" = pull_request || { echo 'Run on a pull request; no reduced-check fallback.'; exit 1; }
          git show "$BASE_SHA:.hw/runtime/hw.py" > "$RUNNER_TEMP/hw-trusted-gate.py"
      - name: Verify full PR and required independent check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 "$RUNNER_TEMP/hw-trusted-gate.py" --project "$GITHUB_WORKSPACE" gate --ci | tee "$RUNNER_TEMP/gate.json"
      - name: Show verification evidence on failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in sorted(Path('.hw/evidence').glob('verify-*/*')):
              if path.is_file() and path.suffix in {'.log', '.json'}:
                  print(f'[hw evidence] {path}')
                  for line in path.read_text(errors='replace').splitlines():
                      print(f'[hw evidence] {line}')
          PY
      # A green check must not read as "the review was verified". When the project decided that a
      # person judges the merge, say so where the reviewer looks, not only in the job log.
      - name: Say who decides this merge
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/gate.json" >> "$GITHUB_STEP_SUMMARY" <<'REPORT'
          import json, sys
          from pathlib import Path
          try:
              result = json.loads(Path(sys.argv[1]).read_text())
          except Exception:
              print('## hw gate\n\nThe gate did not produce a result. See the job log.')
              raise SystemExit(0)
          authority = result.get('review_authority')
          print('## hw gate\n')
          print(f"- status: `{result.get('status')}`")
          print(f"- review required: `{result.get('review_required')}`")
          print(f"- review authority: `{authority}`")
          if result.get('merge_decision') == 'human_required':
              print('\n> [!IMPORTANT]')
              print('> This project set `review.authority` to `human_merge`.')
              print('> CI did **not** verify that an independent review happened, that the reviewed')
              print('> revision matches this head, or that the base is still current.')
              print('> A green check here means the verification commands passed, nothing more.')
              print('> Inspect the diff and the review record, then decide the merge.')
          REPORT

name: Test Dashboard

on:
  push:
    branches: [main, feature/*]
    paths:
      - 'services/dashboard/**'
      - 'packages/transcript-rendering/**'
      - '.github/workflows/test-dashboard.yml'
  pull_request:
    paths:
      - 'services/dashboard/**'
      - 'packages/transcript-rendering/**'
      - '.github/workflows/test-dashboard.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/dashboard
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate release version
        # src/lib/release-version.generated.json は .gitignore された生成物で、
        # ローカルでは predev/prebuild が作る。CI は build を経由しないため、
        # ソースツリーを完成させるこのステップが型チェック・lint の前提になる。
        run: npm run generate-release-version
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint ratchet
        run: |
          set +e
          npx eslint . --format json --output-file eslint-report.json
          ec=$?
          set -e
          if [ "$ec" -ge 2 ]; then
            echo "eslint crashed (exit $ec) — 設定エラーや内部エラーはラチェットに吸収させず即 fail"
            exit "$ec"
          fi
          node scripts/ci/lint-ratchet.mjs eslint-report.json lint-baseline.json

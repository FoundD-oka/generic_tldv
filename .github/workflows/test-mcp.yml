name: Test MCP

on:
  push:
    branches: [main, feature/*]
    paths:
      - 'services/mcp/**'
      - 'services/meeting-api/meeting_api/schemas.py'
      - '.github/workflows/test-mcp.yml'
  pull_request:
    paths:
      - 'services/mcp/**'
      - 'services/meeting-api/**'
      - '.github/workflows/test-mcp.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: services/meeting-api/pyproject.toml
      # fastapi-mcp / mcp はテストが sys.modules でスタブするため install しない
      # (requirements.txt の fastapi-mcp はコンテナ内専用。CI が上流のリリース
      # 事情で赤くなる依存を持ち込まない)。
      - name: Install dependencies
        run: |
          pip install -e libs/admin-models/
          pip install -e services/meeting-api/
          pip install pytest
      - name: Run tests
        run: python -m pytest services/mcp/tests/ -v

name: Test Meeting API

on:
  push:
    branches: [main, feature/*]
    paths:
      - 'services/meeting-api/**'
      - 'libs/admin-models/**'
      - '.github/workflows/test-meeting-api.yml'
  pull_request:
    paths:
      - 'services/meeting-api/**'
      - 'libs/admin-models/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -e libs/admin-models/
          pip install -e services/meeting-api/
          pip install pytest pytest-asyncio httpx psycopg2-binary
      - name: Run unit tests
        run: pytest services/meeting-api/tests/ -v --ignore=services/meeting-api/tests/test_integration_live.py
      - name: Apply transcription dictionary migration
        env:
          DATABASE_URL: postgresql://test_user:test_pass@127.0.0.1:5432/test_db
        run: python scripts/migrations/20260712_add_transcription_dictionary.py up
      - name: Run postgres integration tests
        env:
          RUN_POSTGRES_INTEGRATION_TESTS: "1"
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_pass
          DB_SSL_MODE: disable
        run: |
          set -o pipefail
          pytest services/meeting-api/tests/integration/test_transcription_dictionary_postgres.py -v | tee itest.log
          grep -E "1 passed" itest.log

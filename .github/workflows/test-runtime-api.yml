name: Test Runtime API

on:
  push:
    branches: [main, feature/*]
    paths:
      - 'services/runtime-api/**'
      - '.github/workflows/test-runtime-api.yml'
  pull_request:
    paths:
      - 'services/runtime-api/**'
      - '.github/workflows/test-runtime-api.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: services/runtime-api/pyproject.toml
      - name: Install dependencies
        run: |
          pip install -e "services/runtime-api/[dev]"
          # ruff の既定 rule セットはバージョンで変わる。ベースライン測定時の版に固定し、
          # 上流のリリース事情でラチェットが赤くなる(= 誰も見なくなる)のを防ぐ。
          pip install "ruff==0.16.2"
      - name: Run tests
        run: |
          set +e
          python -m pytest services/runtime-api/tests -v --junitxml=pytest-junit.xml
          ec=$?
          set -e
          # pytest の exit code: 0=全緑, 1=テスト失敗(ベースライン比較で判定する),
          # 2以上=中断・内部エラー・使い方エラー・収集0件。後者はラチェットに吸収させず即 fail。
          if [ "$ec" -ge 2 ]; then
            echo "pytest crashed (exit $ec) — 実行基盤の故障はベースライン比較の対象外"
            exit "$ec"
          fi
      - name: Pytest baseline check
        run: |
          python services/runtime-api/tests/ci/check_pytest_baseline.py \
            pytest-junit.xml services/runtime-api/tests/ci/pytest-baseline.json
      - name: Ruff ratchet
        run: |
          set +e
          ruff check services/runtime-api --output-format json > ruff-report.json
          ec=$?
          set -e
          # ruff の exit code: 0=指摘なし, 1=指摘あり(ラチェットで判定する), 2=ruff 自体のエラー。
          if [ "$ec" -ge 2 ]; then
            echo "ruff crashed (exit $ec) — 設定エラー等はラチェットに吸収させず即 fail"
            exit "$ec"
          fi
          python services/runtime-api/tests/ci/check_ruff_baseline.py \
            ruff-report.json services/runtime-api/tests/ci/ruff-baseline.json

name: Test Transcription Service

on:
  push:
    branches: [main, feature/*]
    paths:
      - 'services/transcription-service/**'
      - '.github/workflows/test-transcription-service.yml'
  pull_request:
    paths:
      - 'services/transcription-service/**'
      - '.github/workflows/test-transcription-service.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: services/transcription-service/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r services/transcription-service/requirements.txt
          pip install pytest pytest-asyncio
      - name: Run tests
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m pytest services/transcription-service/tests/ -v

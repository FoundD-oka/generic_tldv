name: Test Vexa Bot

on:
  push:
    branches: [main, feature/*]
    paths:
      - 'services/vexa-bot/core/**'
      - '.github/workflows/test-vexa-bot.yml'
  pull_request:
    paths:
      - 'services/vexa-bot/core/**'
      - '.github/workflows/test-vexa-bot.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/vexa-bot/core
    env:
      # npm install 時の自動ブラウザ DL は止める。core の npm test には
      # Playwright の chromium を実際に起動するテスト
      # (authenticated-join / googlemeet-roster-dom)があるため、必要な
      # ブラウザは下の "Install Playwright Chromium" で明示的に入れる。
      # puppeteer はテストで使わないので DL しない。
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PUPPETEER_SKIP_DOWNLOAD: "1"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/vexa-bot/core/package-lock.json
      # 親 services/vexa-bot は npm workspaces のルートなので、core で素の
      # npm ci を実行すると npm が親をルートと判定し core/package-lock.json を
      # 使わない(親の lockfile で親の node_modules へ install する)。
      # --prefix . で core 単体をルートとして扱わせ、core の lockfile を使う。
      - name: Install dependencies
        run: npm ci --prefix . --no-audit --no-fund
      # lockfile で固定した core の playwright(1.56.0)に対応する chromium と
      # headless shell、及び OS 依存ライブラリを入れる。npx だと workspaces の
      # 解決で別版を取得しうるため、core の node_modules の bin を直接使う。
      # 明示的な install コマンドは PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD の影響を受けない。
      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run tests
        run: npm test
